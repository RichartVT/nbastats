services:
  db:
    image: postgres:17-alpine
    container_name: nbastats-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nbastats
      POSTGRES_PASSWORD: nbastats
      POSTGRES_DB: nbastats
      # Espacio de trabajo generoso: las vistas materializadas hacen
      # window functions sobre cientos de miles de filas.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
    ports:
      # 5433 en el host para no chocar con el postgresql@14 de Homebrew,
      # que suele ocupar el 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbastats -d nbastats"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
