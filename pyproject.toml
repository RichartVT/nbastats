[project]
name = "nbastats"
version = "0.1.0"
description = "Plataforma de estadísticas NBA — detección de patrones y tendencias"
requires-python = ">=3.12"
dependencies = [
    # --- Datos ---
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- Ingesta ---
    "nba-api>=1.7",
    "httpx>=0.27",
    "tenacity>=9.0",
    "typer>=0.15",
    "rich>=13.9",
    # --- Procesamiento ---
    "polars>=1.17",
    "pyarrow>=18.0",
    "duckdb>=1.1",
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pymannkendall>=1.4",
    "ruptures>=1.1",
    # --- API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
nbastats = "nbastats.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbastats"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Las migraciones las escribe Alembic; no tiene sentido reformatearlas a mano.
extend-exclude = ["src/nbastats/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 prohíbe llamadas a función en argumentos por defecto. En FastAPI,
# `Depends(...)` y `Query(...)` ahí es precisamente el idioma del framework:
# es como se declaran dependencias y validación. Aquí la regla es un falso
# positivo, no una advertencia útil.
"src/nbastats/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
